function stats(){let rs=Object.values(store.reviews).filter(x=>validRates.includes(x.rate));return {total:PEOPLE.length,seed:PEOPLE.filter(p=>p.seed).length,reviewed:rs.length,due:rs.filter(r=>r.due<=today()).length,again:rs.filter(r=>r.rate==='again').length,hard:rs.filter(r=>r.rate==='hard').length,good:rs.filter(r=>r.rate==='good').length}}
function label(id){return peopleById[id]?.name||id}
function toast(message){let el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
function current(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('person/'))return {view:'person',id:h.slice(7)};return {view:['home','quiz','graph','progress'].includes(h)?h:'home'}}
function setView(view){location.hash=view==='home'?'#home':'#'+view;if(current().view===view)render();window.scrollTo({top:0,behavior:'auto'})}
function goPerson(id){if(peopleById[id])location.hash='person/'+id}
function badges(p){return (p.tags||[]).map(t=>'<span>'+esc(t)+'</span>').join('')}
function card(p){let r=store.reviews[p.id];return '<article class="person-card" data-card="'+esc(p.id)+'" tabindex="0" role="button" aria-label="打开'+esc(p.name)+'关联卡">'+
'<div class="card-top"><div class="person-initial">'+esc(p.name.charAt(0))+'</div><div class="meta-right">'+(p.seed?'<span class="mini-badge marked">本次错题相关</span>':'')+(r?'<span class="mini-badge">'+(r.rate==='again'?'待加强':r.rate==='hard'?'模糊':'自评会')+'</span>':'')+'</div></div>'+
'<h3>'+esc(p.name)+'</h3><p class="en">'+esc(p.en)+'</p><div class="tag-list">'+badges(p)+'</div><p class="ideatext">'+esc(p.idea)+'</p><div class="card-bottom"><small>'+esc(p.group)+' · '+esc(p.year)+'</small><button class="link-btn" data-person="'+p.id+'">查看完整关联 ↗</button></div></article>'}
function hero(){let s=stats();return '<section class="hero"><div><div class="eyebrow">CONNECTIONS, NOT FRAGMENTS · 01</div><h1>把建筑师，<br>记成一张<em>关系网。</em></h1><p>用「人物 → 思想 → 设计手法 → 代表作品 → 横向关联」找回知识之间的联系。先从这次做错的六道题出发，再逐步扩展整个外国近现代史。</p></div><div class="hero-art"><b>A·A</b><label>THE ARCHITECT NETWORK</label></div></section><section class="stats"><div class="stat"><strong>'+s.total+'</strong><span>建筑师关联卡</span></div><div class="stat"><strong>'+s.seed+'</strong><span>这次错题关联人物</span></div><div class="stat"><strong>'+s.reviewed+'</strong><span>已有自评记录</span></div><div class="stat"><strong>'+s.due+'</strong><span>今日待复测</span></div></section>'}
function home(){let opts=['全部','本次错题',...groupOrder];let q=search.trim().toLowerCase();let results=PEOPLE.filter(p=>(filter==='全部'||(filter==='本次错题'&&p.seed)||p.group===filter)&&(!q||[p.name,p.en,p.idea,p.method,p.group,p.tags.join(' '),p.works.map(w=>w[0]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>Number(b.seed)-Number(a.seed));return '<div class="page">'+hero()+'<div class="toolbar"><div><h2 class="section-title">人物卡片库 <span style="color:#a4a59c;font-size:14px;font-weight:400">/ '+results.length+'</span></h2><p class="section-sub">先按关联理解，再通过闭卷输出验证。</p></div><div class="search"><input id="searchInput" placeholder="搜索人物、作品、概念…" autocomplete="off" value="'+esc(search)+'" aria-label="搜索卡片"></div></div><div class="filterbar">'+opts.map(o=>'<button class="chip '+(o===filter?'active':'')+'" data-filter="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div id="cardGrid" class="grid-cards">'+(results.length?results.map(card).join(''):'<div class="empty">没有匹配的关联卡。换个关键词试试。</div>')+'</div></div>'}
function detail(p){if(!p)return home();const r=store.reviews[p.id];const photo='https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(p.photo||p.name)+'&title=Special:MediaSearch&go=Go&type=image';let works=p.works.map(w=>'<div class="work"><strong>'+esc(w[0])+'</strong><small>'+esc(w[1])+'</small><p>'+esc(w[2])+'</p></div>').join('');let relations=p.relate.map(([id,why])=>'<button class="relation" data-person="'+esc(id)+'"><strong>'+esc(label(id))+' ↗</strong><small>'+esc(why)+'</small></button>').join('');let source=p.source?'<a target="_blank" rel="noopener noreferrer" href="'+esc(p.source)+'">外部参考资料 ↗</a>':'补充学习卡，未做逐条教材定位';return '<div class="page"><button class="back-link" data-view="home">← 返回人物库</button><section class="detail-head"><div><div class="eyebrow">ARCHITECT PROFILE / '+esc(p.year)+'</div><h1>'+esc(p.name)+'</h1><div class="english">'+esc(p.en)+'</div><div class="tag-list" style="margin-top:18px">'+badges(p)+'</div></div><div class="headside"><div class="era">'+esc(p.group)+'</div><div style="margin-top:17px"><button class="action-btn" data-start-one="'+esc(p.id)+'">闭卷测这个人物 ↗</button></div></div></section><div class="detail-grid"><div style="display:grid;gap:16px"><section class="info-panel"><h3><span class="number">01</span>思想立场 · WHY</h3><p>'+esc(p.idea)+'</p></section><section class="info-panel"><h3><span class="number">02</span>设计手法 · HOW</h3><p>'+esc(p.method)+'</p></section><section class="info-panel"><h3><span class="number">03</span>作品对应 · WHAT</h3><div class="works-list">'+works+'</div></section><section class="info-panel"><h3><span class="number">04</span>横向关联 · COMPARE</h3><div class="relate-list">'+relations+'</div></section></div><div style="display:grid;align-content:start;gap:16px"><section class="info-panel"><div class="eyebrow">RECALL QUESTION</div><h3 style="font-size:18px;line-height:1.6;margin-top:14px">'+esc(p.question)+'</h3><p style="font-size:12px;margin:15px 0;color:#818b82">'+(r?'最近自评：'+(r.rate==='again'?'不会':r.rate==='hard'?'模糊':'会')+' · 下次 '+r.due:'还没有复测记录')+'</p><button class="action-btn wide" data-start-one="'+esc(p.id)+'">进入闭卷练习</button></section><div class="warn"><strong style="display:block;margin-bottom:7px">易混警报</strong>'+esc(p.trap)+'</div><section class="info-panel"><h3>真实建筑图源</h3><p style="font-size:12px;margin-bottom:15px">用 Wikimedia Commons 站内图片检索查看建筑实景，不用 AI 生成图代替建筑史证据。</p><a class="action-btn secondary" href="'+photo+'" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-block">查看真实图片 ↗</a></section><div class="source-note">资料口径：'+(p.seed?'本次上传的填空错题与外部复核；':'补充关联学习卡；')+' '+source+'。<br>本卡不自动标为已掌握，也不宣称已通过教材逐条验收。</div></div></div></div>'}
function makeQuiz(mode,solo){quizMode=solo?'solo':mode||quizMode;let ids=solo?[solo]:quizMode==='seed'?PEOPLE.filter(p=>p.seed).map(p=>p.id):quizMode==='due'?PEOPLE.filter(p=>store.reviews[p.id]&&store.reviews[p.id].due<=today()).map(p=>p.id):PEOPLE.map(p=>p.id);if(quizMode==='all')ids.sort((a,b)=>{const x=store.reviews[a],y=store.reviews[b];const score=r=>r?(r.rate==='again'?0:r.rate==='hard'?1:r.due<=today()?2:4):3;return score(x)-score(y)||a.localeCompare(b)});if(quizRound>0&&ids.length>1){let n=quizRound%ids.length;ids=[...ids.slice(n),...ids.slice(0,n)]}quizOrder=ids;quizIdx=0;revealed=false}
function quiz(){if(!quizOrder.length)makeQuiz(quizMode);let s=stats();let p=peopleById[quizOrder[quizIdx]];let tabs=[['seed','本次 6 题'],['due','今日待复测 ('+s.due+')'],['all','全部人物']];return '<div class="page"><div class="section-head"><div class="eyebrow">ACTIVE RECALL · 02</div><h1>闭卷，才能知道会不会。</h1><p>先独立写出要点，再揭晓参考答案。只有你自己点击“会 / 模糊 / 不会”后才记录复习状态。</p></div><div class="filterbar">'+tabs.map(([id,name])=>'<button class="chip '+(quizMode===id?'active':'')+'" data-quiz-mode="'+id+'">'+name+'</button>').join('')+'</div><div class="quiz-layout"><section class="quiz-card">'+(p?'<div class="quiz-kicker">QUESTION '+String(quizIdx+1).padStart(2,'0')+' / '+String(quizOrder.length).padStart(2,'0')+'　 · '+esc(p.seed?'本次错题关联':'延伸复测')+'</div><h2>'+esc(p.name)+'</h2><div class="quiz-en">'+esc(p.en)+'</div><div class="quiz-prompt">'+esc(p.question)+'</div><textarea id="quizDraft" class="answer-textarea" placeholder="先把脑海中的知识点写下来，别急着看答案…" aria-label="闭卷作答">'+esc(store.drafts[p.id]||'')+'</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:13px;flex-wrap:wrap"><button class="action-btn '+(revealed?'secondary':'')+'" data-reveal="1">'+(revealed?'收起参考答案':'揭晓参考答案')+'</button><button class="action-btn ghost" data-person="'+p.id+'">查看关联卡 ↗</button></div>'+(revealed?'<div class="answer-box"><strong>参考要点</strong><p>'+esc(p.answer)+'</p><p style="font-size:12px;color:#898b7e">易混：'+esc(p.trap)+'</p></div><div style="font-size:12px;color:#92958e;margin-top:16px">根据自己的作答而不是眼熟程度评估：</div><div class="rating-row"><button class="rate-btn" data-rate="again">× 不会 · 明天复测</button><button class="rate-btn" data-rate="hard">≈ 模糊 · 3天后</button><button class="rate-btn" data-rate="good">✓ 会 · 7天后</button></div>':'')+'</section>':'<div class="empty">这组暂时没有到期内容。可以切到“本次 6 题”或“全部人物”。</div>')+'</section><aside class="quiz-aside"><h3>复习规则</h3><p>不是机械地从第 1 题反复刷。全部人物优先安排你自评“不会、模糊”和已经到期的项目。</p><ol class="muted-list"><li>先闭卷输出</li><li>对照参考要点</li><li>自主评估</li><li>按 1 / 3 / 7 天复测</li></ol><div class="notice">当前为单设备本地记录；换浏览器或清除站点数据前，先在“复习记录”导出备份。</div></aside></div></div>'}
const relationTopics=[{title:'工业设计的形成',sub:'从手工艺批评走向工业设计和包豪斯',ids:['morris','behrens','gropius']},{title:'现代空间的不同路径',sub:'自由平面、流动空间、体积规划、有机建筑不可混为一谈',ids:['loos','lecorbusier','mies','wright','rietveld','aalto']},{title:'战后现代主义的反思',sub:'人性、材料、结构与纪念性',ids:['smithson','kahn','tange','stirling']},{title:'对纯粹现代主义的批判',sub:'复杂性、类型学、建筑语言与都市程序',ids:['venturi','rossi','eisenman','koolhaas']}];
function graph(){let pairs=[['morris','behrens','从工艺改革走向工业设计'],['behrens','gropius','师承与现代工业建筑'],['sullivan','wright','师承与有机建筑'],['mies','venturi','少即是多 ↔ 少即是乏味'],['mies','smithson','钢框架语言与新粗野主义'],['mies','kahn','流动/全面空间 ↔ 服务/被服务空间'],['lecorbusier','aalto','功能理性 ↔ 人情化'],['venturi','rossi','多义象征 ↔ 类型与城市记忆'],['rossi','eisenman','城市类型 ↔ 建筑语言'],['eisenman','koolhaas','形式操作 ↔ 都市程序']];return '<div class="page"><div class="section-head"><div class="eyebrow">KNOWLEDGE NETWORK · 03</div><h1>不是时间表，是思想的连接。</h1><p>先沿一条线索理解人物，再横向比较两个理论为什么不同。点击任意名字打开完整关联卡。</p></div>'+relationTopics.map((topic,i)=>'<section class="group-section"><div class="eyebrow">CHAIN 0'+(i+1)+'</div><h2>'+esc(topic.title)+'</h2><div class="group-caption">'+esc(topic.sub)+'</div><div class="group-chain">'+topic.ids.map(id=>{let p=peopleById[id];return '<button class="mini-node" data-person="'+id+'"><strong>'+esc(p.name)+' ↗</strong><span>'+esc(p.tags.join(' · '))+'</span></button>'}).join('')+'</div></section>').join('')+'<h2 class="section-title" style="margin:43px 0 18px">最值得记的横向对照</h2><div class="relation-grid">'+pairs.map(([a,b,text])=>'<div class="connection-card"><div class="comparison"><button class="link-btn" data-person="'+a+'">'+esc(label(a))+'</button> ↔ <button class="link-btn" data-person="'+b+'">'+esc(label(b))+'</button></div><p>'+esc(text)+'</p></div>').join('')+'</div></div>'}
function progress(){let s=stats();const rs=PEOPLE.filter(p=>store.reviews[p.id]).sort((a,b)=>(store.reviews[a.id]?.due||'').localeCompare(store.reviews[b.id]?.due||''));return '<div class="page"><div class="section-head"><div class="eyebrow">REVIEW TRACKER · 04</div><h1>复习记录</h1><p>只有完成闭卷练习并主动自评的卡片才计入记录。数据仅保存在当前设备的浏览器。</p></div><section class="stats"><div class="stat"><strong>'+s.reviewed+'</strong><span>已自评人物</span></div><div class="stat"><strong>'+s.again+'</strong><span>自评不会</span></div><div class="stat"><strong>'+s.hard+'</strong><span>自评模糊</span></div><div class="stat"><strong>'+s.due+'</strong><span>到期待复测</span></div></section><div class="progress-panels"><section class="progress-panel"><h3>到期队列</h3><p>不是简单“从头开始”，到期项目会在混测里被提前安排。</p><div class="row-list">'+(rs.length?rs.slice(0,12).map(p=>{let r=store.reviews[p.id];return '<button class="row-item" data-start-one="'+p.id+'" style="border:0;text-align:left;cursor:pointer"><strong>'+esc(p.name)+'</strong><span>'+esc(r.due)+(r.due<=today()?' · 到期':'')+'</span></button>'}).join(''):'<div class="empty" style="padding:22px">还没有任何自评记录。先去做一次闭卷复测。</div>')+'</div><div style="margin-top:19px"><button class="action-btn secondary" data-quiz-mode="due">练今日到期 ↗</button></div></section><section class="progress-panel"><h3>个人数据</h3><p>在 iPad、手机、电脑之间不会自动同步。可导出 JSON，再在另一台设备导入；导入只更新复习数据，不修改题库。</p><div class="progress-actions"><button class="action-btn" id="exportBtn">导出复习记录</button><button class="action-btn secondary" id="importBtn">导入记录</button></div><input type="file" id="fileImport" accept="application/json,.json" style="display:none"><div class="notice">数据分级表示的是本次自评，不是 AI 批改的 A/B/C 等级，也不是考试得分。</div><div style="margin-top:20px"><button class="link-btn" id="resetBtn" style="font-size:12px">清空本机复习记录</button></div></section></div></div>'}
function updateNav(view){document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('active',el.dataset.view===(view==='person'?'home':view)))}
function render(){let x=current();if(x.view==='home')$('#app').innerHTML=home();else if(x.view==='person')$('#app').innerHTML=detail(peopleById[x.id]);else if(x.view==='quiz')$('#app').innerHTML=quiz();else if(x.view==='graph')$('#app').innerHTML=graph();else $('#app').innerHTML=progress();updateNav(x.view);$('#navTotal').textContent=PEOPLE.length;document.title=(x.view==='person'?label(x.id)+' · ':x.view==='quiz'?'闭卷复测 · ':x.view==='progress'?'复习记录 · ':'')+'人物关联卡 · 外国近现代建筑史'}
function next(){revealed=false;quizIdx++;if(quizIdx>=quizOrder.length){quizRound++;makeQuiz(quizMode);toast('本轮已完成，已重新编排一批')}render()}
function record(rate){let id=quizOrder[quizIdx];if(!id||!revealed||!validRates.includes(rate))return;let prev=store.reviews[id]||{tries:0};let days=rate==='again'?1:rate==='hard'?3:7;store.reviews[id]={rate,last:today(),due:after(days),tries:(prev.tries||0)+1};save();toast('已记录：'+label(id)+' · '+(rate==='again'?'明天':days+'天后')+'复测');next()}
function download(){let payload={format:'architect-links-review',version:1,exported_at:new Date().toISOString(),reviews:store.reviews,drafts:store.drafts};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='建筑师人物关联卡_复习记录_'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('复习记录已导出')}
function importData(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(x.format!=='architect-links-review'||x.version!==1||!x.reviews||typeof x.reviews!=='object')throw Error('文件格式不匹配');let added=0;for(let [id,r] of Object.entries(x.reviews)){if(!peopleById[id]||!validRates.includes(r.rate)||!/^\d{4}-\d{2}-\d{2}$/.test(r.due||''))continue;let prev=store.reviews[id];if(!prev||String(r.last||'')>=String(prev.last||'')){store.reviews[id]={rate:r.rate,last:r.last||r.due,due:r.due,tries:Math.max(0,Number(r.tries)||1)};added++}}if(x.drafts&&typeof x.drafts==='object'){for(let [id,value] of Object.entries(x.drafts)){if(peopleById[id]&&typeof value==='string'&&!store.drafts[id])store.drafts[id]=value.slice(0,15000)}}save();render();toast('导入完成，合并了 '+added+' 条记录')}catch(e){toast('导入失败：'+e.message)}};reader.readAsText(file,'utf-8')}
function filteredCards(){let q=search.trim().toLowerCase();let ps=PEOPLE.filter(p=>(filter==='全部'||(filter==='本次错题'&&p.seed)||p.group===filter)&&(!q||[p.name,p.en,p.idea,p.method,p.group,p.tags.join(' '),p.works.map(w=>w[0]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>Number(b.seed)-Number(a.seed));$('#cardGrid').innerHTML=ps.length?ps.map(card).join(''):'<div class="empty">没有匹配的关联卡。换个关键词试试。</div>';let cnt=document.querySelector('.section-title span');if(cnt)cnt.textContent='/ '+ps.length}
document.addEventListener('click',e=>{const act=e.target.closest('button,[data-card]');if(!act)return;if(act.dataset.person){goPerson(act.dataset.person);return}if(act.dataset.card){goPerson(act.dataset.card);return}if(act.dataset.view){setView(act.dataset.view);return}if(act.dataset.filter){filter=act.dataset.filter;render();return}if(act.dataset.startOne){makeQuiz('solo',act.dataset.startOne);setView('quiz');return}if(act.dataset.quizMode){quizRound=0;makeQuiz(act.dataset.quizMode);setView('quiz');return}if(act.dataset.reveal){revealed=!revealed;render();return}if(act.dataset.rate){record(act.dataset.rate);return}if(act.id==='sideMistakes'){filter='本次错题';setView('home');return}if(act.id==='exportBtn'){download();return}if(act.id==='importBtn'){$('#fileImport').click();return}if(act.id==='resetBtn'){if(confirm('确认清空本机全部复习记录和草稿吗？此操作不能撤销。')){store=storeDefault();save();render();toast('本机记录已清空')}return}if(act.id==='mobileProgress'){setView('progress')}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();goPerson(e.target.dataset.card)}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){search=e.target.value;filteredCards()}if(e.target.id==='quizDraft'&&quizOrder[quizIdx]){store.drafts[quizOrder[quizIdx]]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='fileImport')importData(e.target.files?.[0])});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'auto'})});
if(!location.hash)location.replace('#home');render();
})();

</script>
</body>
